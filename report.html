<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>報表 - 記帳系統</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="container">
  <h1>📊 統計報表</h1>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <h3 class="mt-0">篩選條件</h3>
        <div class="field"><label>年份</label><select id="filter-year"></select></div>
        <div class="field"><label>月份</label><select id="filter-month"></select></div>
        <hr class="divider" />
        <div class="field">
          <label>報表類型</label>
          <select id="report-type">
            <option value="monthly">全員月報</option>
            <option value="compare">月份比較</option>
            <option value="yearly">年度統計</option>
          </select>
        </div>
        <hr class="divider" />
        <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem">
          <input type="checkbox" id="manage-mode" style="width:auto" /> 🔧 管理模式
        </label>
      </div>
    </aside>

    <main id="report-main"></main>
  </div>

  <hr class="divider" />
  <h2>🔍 費用查詢</h2>
  <details class="expander">
    <summary>展開查詢</summary>
    <div class="cards-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="field"><label>人員</label><select id="query-person"></select></div>
      <div class="field"><label>類別</label><select id="query-category"></select></div>
      <div class="field"><label>金額（0=不限）</label><input type="number" id="query-amount" min="0" step="10" value="0" /></div>
    </div>
    <button class="primary" id="btn-query">查詢</button>
    <div id="query-result"></div>
  </details>

  <hr class="divider" />
  <h2>匯出資料</h2>
  <div class="btn-row">
    <button id="btn-export-csv">📥 匯出 CSV</button>
    <button id="btn-export-html">📄 匯出 HTML 報表</button>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/parser.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/report.js"></script>
</body>
</html>
